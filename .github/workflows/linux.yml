name: Linux validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dbus build-essential git xvfb xauth dbus-x11 libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libnotify4 libnss3 libx11-xcb1 libxkbcommon0 libxss1 libxtst6
      - run: npm ci
      - name: Preparar o helper do sandbox do Electron
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run check
      # Lint não bloqueante até os erros apontados serem tratados (docs/DIVIDAS.md #21).
      - name: Lint (Biome)
        run: npm run lint
        continue-on-error: true
      - name: Formatação (Biome)
        run: npm run format:check
      - run: npm test
      - name: Phase 0 Electron sandbox and lifecycle
        run: xvfb-run -a dbus-run-session -- npm run test:desktop
      - name: Fases 1–4A continuity, recovery, workspaces and PTY lifecycle
        run: KARONT_TEST_NOTIFICATIONS=1 xvfb-run -a dbus-run-session -- npm run test:e2e
      - name: Upload benchmark and E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karont-linux-phase4a-evidence
          path: |
            benchmarks/runs/
            benchmarks/spec005/
            benchmarks/spec006/
          if-no-files-found: ignore
